<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="60%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#f5a62300"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1026"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" fill="url(#bg)" rx="12"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="40" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="280" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="60" r="1.5"><animate attributeName="opacity" values="1;.3;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="290" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="270" r="1.1"><animate attributeName="opacity" values=".4;1;.4" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="90" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="300" r="1"/>
    <circle cx="90" cy="150" r="1"/>
    <circle cx="730" cy="190" r="1"/>
  </g>

  <!-- orbits -->
  <g fill="none" stroke="#58a6ff" stroke-opacity=".25" stroke-dasharray="4 6">
    <ellipse cx="400" cy="160" rx="110" ry="50"/>
    <ellipse cx="400" cy="160" rx="200" ry="90"/>
    <ellipse cx="400" cy="160" rx="300" ry="130"/>
  </g>

  <!-- sun -->
  <circle cx="400" cy="160" r="38" fill="url(#sun)"/>
  <circle cx="400" cy="160" r="14" fill="#ffd966"/>

  <!-- planet 1 -->
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="8s" repeatCount="indefinite" path="M510,160 A110,50 0 1,1 290,160 A110,50 0 1,1 510,160"/>
  </circle>
  <!-- planet 2 -->
  <circle r="8" fill="#ff7b72">
    <animateMotion dur="16s" repeatCount="indefinite" path="M600,160 A200,90 0 1,1 200,160 A200,90 0 1,1 600,160"/>
  </circle>
  <!-- planet 3 with ring -->
  <g>
    <circle r="9" fill="#d2a8ff"/>
    <ellipse rx="15" ry="4" fill="none" stroke="#d2a8ff" stroke-opacity=".7"/>
    <animateMotion dur="28s" repeatCount="indefinite" path="M700,160 A300,130 0 1,1 100,160 A300,130 0 1,1 700,160"/>
  </g>

  <text x="400" y="305" text-anchor="middle" font-family="monospace" font-size="13" fill="#8b949e">systems first. space eventually.</text>
</svg>
