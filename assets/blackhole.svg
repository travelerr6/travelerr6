<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a2e0c" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e8590c"/>
      <stop offset="50%" stop-color="#ffd8a8"/>
      <stop offset="75%" stop-color="#e8590c"/>
      <stop offset="100%" stop-color="#7a2e0c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff922b" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ff922b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="bottomHalf"><rect x="0" y="160" width="800" height="160"/></clipPath>
  </defs>

  <rect width="800" height="320" fill="url(#bg)" rx="12"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="40" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="270" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="60" r="1.5"><animate attributeName="opacity" values="1;.3;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="285" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="265" r="1.1"><animate attributeName="opacity" values=".4;1;.4" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="90" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="150" r="1"/>
    <circle cx="730" cy="190" r="1"/>
    <circle cx="470" cy="300" r="1"/>
    <circle cx="640" cy="60" r="1"/>
  </g>

  <!-- ambient glow -->
  <ellipse cx="400" cy="160" rx="260" ry="120" fill="url(#glow)"/>

  <!-- back half of accretion disk (behind the hole) -->
  <ellipse cx="400" cy="160" rx="230" ry="38" fill="none" stroke="url(#disk)" stroke-width="14" filter="url(#blur)" opacity=".8"/>
  <ellipse cx="400" cy="160" rx="200" ry="30" fill="none" stroke="url(#disk)" stroke-width="5" opacity=".9"/>

  <!-- lensed light bent over the top and under the bottom -->
  <ellipse cx="400" cy="160" rx="92" ry="64" fill="none" stroke="#ffb066" stroke-width="3" opacity=".55" filter="url(#soft)"/>

  <!-- event horizon -->
  <circle cx="400" cy="160" r="52" fill="#000"/>
  <circle cx="400" cy="160" r="53" fill="none" stroke="#ffd8a8" stroke-width="2" opacity=".9"/>

  <!-- front half of accretion disk (in front of the hole) -->
  <g clip-path="url(#bottomHalf)">
    <ellipse cx="400" cy="160" rx="230" ry="38" fill="none" stroke="url(#disk)" stroke-width="14" filter="url(#blur)"/>
    <ellipse cx="400" cy="160" rx="200" ry="30" fill="none" stroke="url(#disk)" stroke-width="5"/>
  </g>

  <!-- swirling matter -->
  <ellipse cx="400" cy="160" rx="215" ry="34" fill="none" stroke="#ffe8cc" stroke-width="1.5" stroke-dasharray="3 22" stroke-linecap="round" opacity=".8">
    <animate attributeName="stroke-dashoffset" from="0" to="-125" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="400" cy="160" rx="175" ry="26" fill="none" stroke="#ffc078" stroke-width="1.5" stroke-dasharray="2 18" stroke-linecap="round" opacity=".7">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>
</svg>
